<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#181c2b"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </radialGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#222838" stroke-width="4"/>

  <!-- Focus Reticle Outer Ring (Subtle) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#2c344a" stroke-width="6" stroke-dasharray="16 12"/>

  <!-- Focus Brackets (Intentional framing) -->
  <!-- Top Left -->
  <path d="M 176 136 L 136 136 L 136 176" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
  <!-- Top Right -->
  <path d="M 336 136 L 376 136 L 376 176" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
  <!-- Bottom Left -->
  <path d="M 176 376 L 136 376 L 136 336" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
  <!-- Bottom Right -->
  <path d="M 336 376 L 376 376 L 376 336" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>

  <!-- Central Focus Node / Play Symbol -->
  <circle cx="256" cy="256" r="88" fill="url(#redGrad)" filter="url(#subtleGlow)"/>
  <polygon points="234,212 300,256 234,300" fill="#ffffff"/>
</svg>
